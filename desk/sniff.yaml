# Phase 1 - passive sniffer. The panel and the box stay wired straight through;
# the ESP only listens. Nothing on the desk bus is driven by the ESP.
#
# Wiring (RJ45 pass-through tap, ESP powered from USB, NOT from the desk):
#   desk G    -> NodeMCU GND
#   desk R    -> divider -> D7 / GPIO13   (panel -> box, A5 frames)
#   desk T    -> divider -> D1 / GPIO5    (box -> panel, 5A frames)
#   (Q200-23 labels are from the box's side: R = box input, T = box output)
#   desk KEY1 -> divider -> D6 / GPIO12   ("P" line)
#   desk KEY2 -> divider -> D2 / GPIO4    (only if the cable carries it)
#   divider: 1 kΩ in series from the desk wire, 2.2 kΩ from the GPIO to GND
#
# What to look for in the logs (ESPHome dashboard -> desk -> Logs):
#   - "Box frames are 5/6 bytes long"
#   - "panel -> A5 ..." frames while pressing up/down/M1..M4 on the panel
#   - "KEY1 -> ON/OFF" and how long it stays on per button press
#   - the 10 s statistics line: bad bytes should be ~0

logger:
  # UART0 is used for the panel bus; logs are available over Wi-Fi.
  baud_rate: 0

uart:
  - id: panel_bus
    # GPIO13 alone selects the hardware UART0 (swapped pins)
    rx_pin: GPIO13
    baud_rate: 9600
    rx_buffer_size: 256
  - id: box_bus
    rx_pin: GPIO5
    baud_rate: 9600
    rx_buffer_size: 256

jsdesk:
  id: desk
  panel_uart: panel_bus
  box_uart: box_bus
  key_in_pin: GPIO12
  key2_in_pin: GPIO4
  min_height: 62
  max_height: 120
  log_frames: true
  height:
    name: Height
  display:
    name: Display
  key1:
    name: KEY1
    entity_category: diagnostic
  key2:
    name: KEY2
    entity_category: diagnostic
  up:
    name: Panel up
    entity_category: diagnostic
  down:
    name: Panel down
    entity_category: diagnostic
  memory1:
    name: Panel M1
    entity_category: diagnostic
  memory2:
    name: Panel M2
    entity_category: diagnostic
  memory3:
    name: Panel M3
    entity_category: diagnostic
  memory4:
    name: Panel M4
    entity_category: diagnostic
